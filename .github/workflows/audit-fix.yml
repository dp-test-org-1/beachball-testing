name: Security Audit — Auto-Fix via sec-pr-builder

# Two-job pipeline:
#   1. detect-vulnerabilities  — lightweight pnpm audit; skips the fix job when clean.
#   2. invoke-sec-pr-builder   — runs only on failures; delegates full remediation,
#                                build verification, and PR creation to the
#                                sec-pr-builder custom Copilot agent.
#
# Triggers:
#   push           — when package manifests change on main or release branches.
#   repository_dispatch — Dependabot alert webhook (immediate response).
#   schedule       — daily safety-net scan at 02:00 UTC.
#   workflow_dispatch — manual on-demand run with configurable severity.

on:
  repository_dispatch:
    types:
      - dependabot-alert
      - dependabot-alert-high
      - dependabot-alert-critical
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity to fix (low | moderate | high | critical)"
        required: false
        default: "high"
        type: choice
        options:
          - low
          - moderate
          - high
          - critical

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Audit Detection ────────────────────────────────────────────────
  detect-vulnerabilities:
    name: Detect audit vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      audit_failed: ${{ steps.audit.outputs.failed }}
      severity: ${{ steps.audit.outputs.severity }}
      vuln_count: ${{ steps.audit.outputs.vuln_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4  # pin to SHA in production
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4  # pin to SHA in production
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        id: audit
        shell: bash
        run: |
          SEVERITY="${{ github.event.inputs.severity || 'high' }}"
          echo "severity=$SEVERITY" >> "$GITHUB_OUTPUT"

          set +e
          pnpm audit --audit-level "$SEVERITY" --json > audit-report.json
          AUDIT_EXIT=$?
          set -e

          vuln_count=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('audit-report.json', 'utf8'));
            const order = {info:0,low:1,moderate:2,high:3,critical:4};
            const min = order['$SEVERITY'] ?? 3;
            let total = 0;
            for (const [k, n] of Object.entries(r.metadata?.vulnerabilities ?? {})) {
              if ((order[k] ?? -1) >= min) total += n;
            }
            console.log(total);
          ")
          echo "vuln_count=$vuln_count" >> "$GITHUB_OUTPUT"

          if [ "$AUDIT_EXIT" -ne 0 ] || [ "$vuln_count" -gt 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Found $vuln_count vulnerabilities at severity >= $SEVERITY — invoking sec-pr-builder"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "Audit clean — no vulnerabilities at severity >= $SEVERITY"
          fi

  # ─── Job 2: Remediation via sec-pr-builder ────────────────────────────────
  invoke-sec-pr-builder:
    name: Invoke sec-pr-builder agent
    needs: detect-vulnerabilities
    if: needs.detect-vulnerabilities.outputs.audit_failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4  # pin to SHA in production
        with:
          node-version: "22.x"

      - name: Install pnpm (resolved from packageManager field)
        shell: bash
        run: |
          pn=$(node -p "require('./package.json').packageManager?.split('@')[1] || 'latest'")
          corepack prepare "pnpm@$pn" --activate
          corepack enable pnpm

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Invoke sec-pr-builder agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_COPILOT_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEVERITY: ${{ needs.detect-vulnerabilities.outputs.severity }}
          VULN_COUNT: ${{ needs.detect-vulnerabilities.outputs.vuln_count }}
        run: |
          copilot \
            --agent=sec-pr-builder \
            --prompt "Fix all $SEVERITY and higher severity vulnerabilities in this pnpm monorepo. \
              There are $VULN_COUNT open vulnerabilities detected by pnpm audit. \
              Remediate direct dependencies using pnpm update and transitive \
              dependencies via pnpm.overrides in the root package.json. \
              Verify all workspace package builds succeed and run the test app build \
              and tests. Open a structured PR following .github/pull_request_template.md, \
              create a GitHub issue for the audit failures, and link the issue to the PR. Use 🤖🔒 emoji in PR title." \
            --allow-tool='shell(pnpm:*)' \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(gh:*)' \
            --allow-tool='shell(node:*)' \
            --allow-tool='shell(date:*)' \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(ls:*)' \
            --allow-tool='shell(npm:*)' \
            --allow-tool=write \
            --no-ask-user
